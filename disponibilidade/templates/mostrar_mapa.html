{% extends 'principal_semtitulo.html' %}
{% load static %}
{% load l10n %}

{% block conteudo %}
<style>
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden; /* Remove completamente a barra de rolagem */
  }
</style>

<div class="p-3 d-flex flex-column" style="height: 100vh;">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h6 class="mb-0 text-primary">Localização do Material</h6>
    <button type="button" class="btn btn-outline-secondary btn-sm" onclick="window.close();">Fechar</button>
  </div>

  {% if disponibilidade.latitude and disponibilidade.longitude %}
    <!-- O mapa preenche o espaço restante da tela -->
    <div id="mapa-pedido" style="flex: 1; width: 100%; border-radius: 8px; border: 1px solid #dee2e6;"></div>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const latitude = Number("{{ disponibilidade.latitude|unlocalize }}");
        const longitude = Number("{{ disponibilidade.longitude|unlocalize }}");

        const map = L.map('mapa-pedido').setView([latitude, longitude], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
          attribution: '&copy; OpenStreetMap contributors',
          maxZoom: 20
        }).addTo(map);

        L.marker([latitude, longitude])
          .addTo(map)
          .bindPopup('<strong>Localização do material</strong>')
          .openPopup();

        setTimeout(function () {
          map.invalidateSize();
        }, 150);
      });
    </script>
  {% else %}
    <div class="alert alert-warning text-center mt-3">
      Coordenadas geográficas não disponíveis para este item.
    </div>
  {% endif %}
</div>
{% endblock conteudo %}
