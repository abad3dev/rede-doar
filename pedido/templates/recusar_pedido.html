{% extends 'principal.html' %}
{% load static %}



{% block conteudo %}

<div class="d-flex justify-content-center mb-3">
  <h5 class="mb-0">Recusar pedido</h5>
</div>

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="alert alert-warning shadow-sm" role="alert">
        <i class="fa-solid fa-triangle-exclamation me-2"></i>
        Tem certeza que deseja recusar este pedido?
      </div>

      <form method="post">
        {% csrf_token %}


        <button type="submit" class="btn btn-danger">Recusar Pedido</button>
        <a href="{% url 'consultar_itensdisponiveis' %}" class="btn btn-secondary">Cancelar</a>
        <input type="hidden" name="id_disponibilidade" value="{{ id_disponibilidade }}">
      </form>

    </div>
  </div>

{% endblock conteudo %}
