        <script>
function abrirPopup(event, url, largura, altura) {
  event.preventDefault();

  
  const esquerda = (window.screen.width / 2) - (largura / 2);
  const topo = (window.screen.height / 2) - (altura / 2);

  const parametros = `width=${largura},height=${altura},top=${topo},left=${esquerda},resizable=no,scrollbars=yes`;

  window.open(url, 'PopupProprietario', parametros);
}
</script>
